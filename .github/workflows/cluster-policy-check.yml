name: cluster-policy-check

# Renders every chart this cluster admits resources from and checks it against
# what kubernetes/apps/security/kyverno-policies enforces at admission time.
# Runs on the surface Renovate itself opens PRs against, so a chart bump
# introducing a disallowed registry, a namespace with a missing or `privileged`
# PSA label, or an object past the annotation-size cap fails here, not on the
# next pod restart after merge -- and not by stalling a live wave -1/-2 sync.
#
# Two passes over the same rendered output:
#   1. scripts/check_cluster_policy.py, which owns the annotation-size cap and
#      the registry's createNamespace/namespaceLabels pairing -- neither of
#      which Kyverno can see, since one is about how ArgoCD applies a manifest
#      and the other about a manifest that does not exist yet.
#   2. the Kyverno CLI running the real policy file over the manifests the
#      script dumps. The script's image and PSA checks are a hand-written
#      mirror of those policies and a mirror can drift; this pass is the one
#      with authority, and it catches what the mirror structurally cannot --
#      an unresolved variable, a broken autogen rewrite, a rule erroring
#      instead of denying.
#
# --audit-warn is required, not cosmetic: workload-best-practices is Audit for
# third-party charts this repo does not author (Cilium, cert-manager, Longhorn,
# Traefik, multus), which produce ~65 warnings. Without the flag the CLI counts
# those as failures and the job never goes green.
#
# terraform/*/values/** is in the path list because those files are the values
# the Terraform layers apply and the ones the script renders with. That is the
# check that catches a chart bump breaking a key: a chart with a
# values.schema.json (traefik) refuses an unknown key and the render fails
# outright, and one without a schema (argo-cd) drops it in silence, which the
# rendered diff shows. Both classes of bug reached main while this job rendered
# chart defaults instead.
#
# appprojects.yaml is in it because the script reads it as the AppProject rules
# and replays ArgoCD's per-object check against them -- tightening a project
# has to re-run the check that says which apps the tightening breaks.
on:
  pull_request:
    paths:
      - "kubernetes/apps/**"
      - "kubernetes/bootstrap/**"
      - "terraform/*/terraform.tfvars"
      - "terraform/*/values/**"
      - "terraform/60-argo-cd/appprojects.yaml"
      - "terraform/40-kube-networking/manifests/**"
      - "scripts/check_cluster_policy.py"
      - ".github/workflows/cluster-policy-check.yml"
  push:
    branches: [main]
    paths:
      - "kubernetes/apps/**"
      - "kubernetes/bootstrap/**"
      - "terraform/*/terraform.tfvars"
      - "terraform/*/values/**"
      - "terraform/60-argo-cd/appprojects.yaml"
      - "terraform/40-kube-networking/manifests/**"
      - "scripts/check_cluster_policy.py"
      - ".github/workflows/cluster-policy-check.yml"

# Nothing past checkout needs the token.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v5
        with:
          version: v3.21.3

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: pip install pyyaml

      # Installed straight from the release rather than via
      # kyverno/action-install-cli: that action is unmaintained (last release
      # Aug 2023) and its cosign path is already broken against current
      # releases, which ship .sigstore.json instead of the .sig/.pem it fetches.
      # All it does for the non-verifying path is this curl and tar, so the
      # third-party indirection buys nothing.
      #
      # KYVERNO_CLI_VERSION tracks the kyverno chart's appVersion
      # (kubernetes/apps/security/kyverno/Chart.yaml) so CI evaluates the
      # policies on the same engine the cluster runs. Renovate keeps it fresh
      # through the custom manager in .github/renovate.json.
      - name: Install the Kyverno CLI
        env:
          # renovate: datasource=github-releases depName=kyverno/kyverno
          KYVERNO_CLI_VERSION: v1.18.2
        run: |
          curl -sSfL -o kyverno.tar.gz \
            "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_CLI_VERSION}/kyverno-cli_${KYVERNO_CLI_VERSION}_linux_x86_64.tar.gz"
          tar -xzf kyverno.tar.gz kyverno
          rm kyverno.tar.gz
          sudo install -m 0755 kyverno /usr/local/bin/kyverno
          rm kyverno
          kyverno version

      - name: Render manifests and check the mirrored rules
        run: python scripts/check_cluster_policy.py --dump rendered

      # Every policy app, not just kyverno-policies: the dump stamps each
      # GitOps app's destination namespace, which is what cluster-secrets'
      # keys-carry-namespace-prefix rule builds its expected Key Vault prefix
      # from -- so an ExternalSecret reaching for another namespace's key is
      # caught here too.
      #
      # azdo-deployer ships a second policy file, namespace-fence.yaml, and it is
      # deliberately absent below. Its rules match on `subjects`, and the CLI
      # supplies no requester -- with none it treats a subject-matched rule as
      # matching every request, so the fence fires against namespaces no pipeline
      # will ever touch (Namespace/cilium-secrets among them) and the job fails on
      # manifests the cluster admits. Passing a synthetic --userinfo would silence
      # that, at the cost of a file that also silently scopes any future
      # subject- or role-matched rule in the two policy files above. The fence is
      # verified against a live API server with `kubectl --as` instead
      # (documentation/infrastructure/azdo_agents.md).
      - name: Evaluate the real policies against the rendered manifests
        run: |
          kyverno apply \
            kubernetes/apps/security/kyverno-policies/files/policies.yaml \
            kubernetes/apps/security/cluster-secrets/files/policies.yaml \
            kubernetes/apps/platform/azdo-deployer/files/policies.yaml \
            --resource rendered \
            --audit-warn

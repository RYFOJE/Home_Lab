[defaults]
inventory = inventory.yml
roles_path = roles
interpreter_python = auto_silent
stdout_callback = yaml
display_skipped_hosts = False
retry_files_enabled = False

# The LXCs are rebuilt from scratch by 20-proxmox on every full rebuild, so their
# host keys change and a known_hosts entry is a false negative rather than a
# check (documentation/infrastructure/disaster_recovery.md, Complete Site Rebuild).
host_key_checking = False

[ssh_connection]
pipelining = True

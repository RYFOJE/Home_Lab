---
- name: Create the kube config directory
  ansible.builtin.file:
    path: "{{ azdo_agent_home }}/.kube"
    state: directory
    owner: "{{ azdo_agent_user }}"
    group: "{{ azdo_agent_group }}"
    mode: "0700"

- name: Write the deployer kubeconfig
  ansible.builtin.template:
    src: kubeconfig.j2
    dest: "{{ azdo_agent_home }}/.kube/config"
    owner: "{{ azdo_agent_user }}"
    group: "{{ azdo_agent_group }}"
    mode: "0600"
  no_log: "{{ azdo_agent_no_log }}"

# Proves the whole chain in one call: the token was read, the kubeconfig is
# valid, FW-003 permits the path, and the RoleBinding the azdo-deployer app
# renders is in place. A `no` here is one of those four, not a typo.
- name: Verify the deployer identity
  ansible.builtin.command:
    argv:
      - kubectl
      - auth
      - can-i
      - create
      - deployment
      - --namespace={{ azdo_agent_parent_namespace }}
  become: true
  become_user: "{{ azdo_agent_user }}"
  environment:
    KUBECONFIG: "{{ azdo_agent_home }}/.kube/config"
  register: azdo_agent_can_i
  changed_when: false
  failed_when: azdo_agent_can_i.stdout | trim != 'yes'

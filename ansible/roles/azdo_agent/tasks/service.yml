---
# svc.sh writes the generated unit name into `.service`. Guarding on the unit
# path instead is not an option: the unit is named
# vsts.agent.<org>.<pool>.<agent>.service, so the path itself carries the
# organisation and cannot be written down in this repo (README PII rule).
- name: Check whether the systemd unit has been installed
  ansible.builtin.stat:
    path: "{{ azdo_agent_home }}/.service"
  register: azdo_agent_unit_file

- name: Install the systemd unit
  ansible.builtin.command:
    argv:
      - ./svc.sh
      - install
      - "{{ azdo_agent_user }}"
    chdir: "{{ azdo_agent_home }}"
  when: not azdo_agent_unit_file.stat.exists
  changed_when: true

- name: Read the unit name
  ansible.builtin.slurp:
    src: "{{ azdo_agent_home }}/.service"
  register: azdo_agent_unit
  no_log: "{{ azdo_agent_no_log }}"

- name: Ensure the agent service is enabled and running
  ansible.builtin.systemd_service:
    name: "{{ azdo_agent_unit.content | b64decode | trim }}"
    state: started
    enabled: true
    daemon_reload: true
  no_log: "{{ azdo_agent_no_log }}"

---
# Mints the agents' cluster credential on the control node.
#
# The ServiceAccount token is derived state: it is regenerated on every cluster
# rebuild and every time the Secret is recreated. A Key Vault copy would be a
# second statement of a value that changes without anyone touching Key Vault,
# and its failure mode is silent -- a stale token authenticates as nobody, days
# later. Terraform cannot own it either without inverting the layering: it is a
# wave-2 GitOps object, so a resource reading it would have to block on ArgoCD.
#
# The cost is that this play holds cluster-admin for one `kubectl get secret`.
# It is written to a mode-0600 tempfile on the control node, never copied to a
# host, and removed by the play's always-block.
#
# run_once with delegate_to: localhost -- one read, and set_fact under run_once
# lands on every host in the play.

- name: Create a scratch file for the break-glass kubeconfig
  ansible.builtin.tempfile:
    state: file
    suffix: .kubeconfig
  register: azdo_admin_kubeconfig
  delegate_to: localhost
  run_once: true
  changed_when: false

- name: Write the break-glass kubeconfig
  ansible.builtin.copy:
    content: >-
      {{ lookup('ansible.builtin.pipe',
                'az keyvault secret show --vault-name ' ~ key_vault_name ~
                ' --name talos-kubeconfig --query value -o tsv') }}
    dest: "{{ azdo_admin_kubeconfig.path }}"
    mode: "0600"
  delegate_to: localhost
  run_once: true
  no_log: true

- name: Read the deployer ServiceAccount token
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig={{ azdo_admin_kubeconfig.path }}
      - --namespace={{ azdo_identity_namespace }}
      - get
      - secret
      - azdo-deployer-token
      - --output=jsonpath={.data.token}
  register: azdo_sa_token_raw
  delegate_to: localhost
  run_once: true
  changed_when: false
  no_log: true

# Endpoint and CA come out of the break-glass kubeconfig rather than being
# restated here: whatever SANs Talos issued the serving certificate for, that
# file already agrees with them.
- name: Extract the cluster endpoint, CA and token
  ansible.builtin.set_fact:
    azdo_cluster: >-
      {{ (lookup('ansible.builtin.file', azdo_admin_kubeconfig.path)
          | from_yaml).clusters[0].cluster }}
    azdo_sa_token: "{{ azdo_sa_token_raw.stdout | b64decode }}"
  delegate_to: localhost
  run_once: true
  no_log: true

# The Secret is populated by the token controller, not by ArgoCD, so a run
# started the moment the app reports Synced can read it back empty.
- name: Fail without a ServiceAccount token
  ansible.builtin.assert:
    that: azdo_sa_token | length > 0
    fail_msg: >-
      No token in {{ azdo_identity_namespace }}/azdo-deployer-token. The
      azdo-deployer app must be Synced and the token controller must have
      populated the Secret before this play can run
      (documentation/infrastructure/azdo_agents.md).
  run_once: true

# Credentials from Azure Key Vault via the azure-kv ClusterSecretStore.
# Keys carry this namespace's prefix (`databases--`), which the cluster-secrets
# Kyverno policy requires; `dataFrom` is forbidden there, so each key is listed.
#
# CloudNativePG expects kubernetes.io/basic-auth Secrets with `username` and
# `password`. The usernames are fixed by the cluster definition rather than
# stored, so only the passwords come from the vault -- two secrets instead of
# four, and no way for a vault edit to rename the superuser out from under the
# operator. The {{ "{{ .password }}" }} interpolation is ESO's own templating,
# escaped so Helm passes it through.
#
# Letting the operator generate these instead would leave the only copy of the
# credential inside the cluster, which is exactly the copy a rebuild does not
# have (infrastructure/disaster_recovery.md).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.clusterName }}-superuser
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  target:
    name: {{ .Values.clusterName }}-superuser
    template:
      type: kubernetes.io/basic-auth
      data:
        username: postgres
        password: "{{ `{{ .password }}` }}"
  data:
    - secretKey: password
      remoteRef:
        key: databases--postgres-superuser-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.clusterName }}-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  target:
    name: {{ .Values.clusterName }}-app
    template:
      type: kubernetes.io/basic-auth
      data:
        username: {{ .Values.bootstrap.owner | quote }}
        password: "{{ `{{ .password }}` }}"
  data:
    - secretKey: password
      remoteRef:
        key: databases--postgres-app-password

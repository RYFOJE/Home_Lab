# The Cloudflare API token cert-manager's DNS-01 solver reads.
#
# It lives here rather than in a cert-manager app because cert-manager is
# installed by Terraform (40-kube-networking) and has no chart in this
# repository, while this app already owns the shared secret plumbing. The
# ClusterIssuer in that layer references the Secret by name; ESO is what puts
# it there.
#
# Previously 40-kube-networking created this Secret directly from a Key Vault
# data source, which meant the token sat in that layer's Terraform state and
# rotating it was an apply. Now the layer never reads it at all.
#
# metadata.namespace is set explicitly: this app's destination is
# external-secrets, and an ExternalSecret only syncs into its own namespace.
# The Kyverno prefix rule reads request.namespace, so the vault key must be
# cert-manager--*, which is why the vault secret carries that name even though
# 50-cloudflare also reads it for the tunnel and the public DNS records
# (../../../../documentation/secrets.md).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
  data:
    - secretKey: api-token
      remoteRef:
        key: cert-manager--cloudflare-dns-api-token

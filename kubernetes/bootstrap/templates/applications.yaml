{{- range .Values.apps }}
{{- if or (not .onlyEdgeMode) (eq .onlyEdgeMode $.Values.edgeMode) }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .name }}
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: {{ .wave | default "0" | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # AppProject created by terraform/60-argo-cd/gitops.tf, not by this chart --
  # a boundary this chart could rewrite would not be one. It closes the
  # cluster-scoped kinds an app may create; namespaces stay open so adding an
  # app is still one directory plus one registry entry. An entry naming a
  # project Terraform has not created lands in an error state, so the set of
  # valid values is the set of AppProjects in gitops.tf.
  project: {{ .project | default "homelab" }}
  source:
    repoURL: {{ $.Values.repoURL }}
    targetRevision: {{ $.Values.revision }}
    path: kubernetes/apps/{{ .group }}/{{ .name }}
    {{- if or .needsDomain .needsTenant .needsVaultUrl }}
    helm:
      parameters:
        {{- if .needsDomain }}
        - name: global.domain
          value: {{ required "domain must be injected by the root Application" $.Values.domain | quote }}
        {{- end }}
        {{- if .needsTenant }}
        - name: global.tenantId
          value: {{ required "tenantId must be injected by the root Application" $.Values.tenantId | quote }}
        {{- end }}
        {{- if .needsVaultUrl }}
        - name: vaultUrl
          value: {{ required "vaultUrl must be injected by the root Application" $.Values.vaultUrl | quote }}
        {{- end }}
    {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    {{- if .namespaceLabels }}
    managedNamespaceMetadata:
      labels:
        {{- range $k, $v := .namespaceLabels }}
        {{ $k }}: {{ $v | quote }}
        {{- end }}
    {{- end }}
    syncOptions:
      - CreateNamespace={{ .createNamespace | default false }}
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      {{- range .extraSyncOptions }}
      - {{ . }}
      {{- end }}
{{- end }}
{{- end }}

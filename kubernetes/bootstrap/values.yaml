# App registry for the root app-of-apps (documentation/programming/gitops_apps.md).
# Adding an app = a new directory under kubernetes/apps/<group>/<name>/ plus one entry here.
#
# domain, tenantId, vaultUrl and edgeMode are injected by the Terraform-created
# root Application (terraform/60-argo-cd/gitops.tf) -- never commit real
# domain/tenant values here (PII rule). repoURL/revision are likewise
# overridden by the root Application so the tracked branch is configured in one
# place (terraform.tfvars).
domain: ""
tenantId: ""
vaultUrl: ""
edgeMode: ""
repoURL: https://github.com/RYFOJE/Home_Lab.git
revision: main

# Fields per entry:
#   name             directory under kubernetes/apps/<group>/ and the Application name
#   group            subfolder under kubernetes/apps/ (security, monitoring, edge, ...)
#   namespace        destination namespace
#   wave             argocd.argoproj.io/sync-wave ordering (lowest first)
#   project          AppProject (terraform/60-argo-cd/gitops.tf), default
#                    homelab. homelab-kube-system for a chart that also writes
#                    into kube-system -- ArgoCD validates every rendered
#                    object's own namespace, not just the destination below.
#   needsDomain      forward the domain as helm parameter global.domain
#   needsTenant      forward the tenant as helm parameter global.tenantId
#   needsVaultUrl    forward the Key Vault URL as helm parameter vaultUrl
#   onlyEdgeMode     render the Application only when edgeMode equals this
#                    value (prune removes it otherwise)
#   createNamespace  ArgoCD creates the namespace (one owner per namespace)
#   namespaceLabels  labels applied to that namespace (PSA enforcement)
#   extraSyncOptions appended to the default syncOptions
#   ignoreDifferences  passed through to spec.ignoreDifferences, for fields a
#                    controller populates on an object this repo declares (a
#                    ServiceAccount token Secret). Without it the app is
#                    permanently OutOfSync and selfHeal, which is on for every
#                    app here, re-syncs in a loop against that controller
apps:
  # The platform-* PriorityClasses the apps below name are NOT here: they are
  # Terraform-owned (40-kube-networking/scheduling.tf). No wave is early enough
  # for them -- ArgoCD's own pods name platform-critical, so a class ArgoCD
  # creates could never admit the release that installs ArgoCD.

  # -- wave -2: secret machinery (operator + policy engine + their CRDs) --
  # No namespaceLabels: the external-secrets namespace is Terraform-owned
  # (60-argo-cd/gitops.tf sets the PSA label there). kubernetes_namespace
  # replaces the whole labels map, so an ArgoCD-managed label would be
  # stripped on every apply and healed back.
  - name: external-secrets
    group: security
    namespace: external-secrets
    wave: "-2"
    createNamespace: true
    extraSyncOptions:
      # secretstores / clustersecretstores exceed the client-side
      # last-applied-configuration annotation limit (~349 KB each vs 256 KB).
      - ServerSideApply=true
  - name: kyverno
    group: security
    namespace: kyverno
    wave: "-2"
    createNamespace: true
    namespaceLabels:
      pod-security.kubernetes.io/enforce: baseline
    extraSyncOptions:
      # policies / clusterpolicies are ~652 KB each -- same limit as above.
      # Both these apps are wave -2, so a failure here stalls every later wave.
      - ServerSideApply=true

  # -- wave -1: the single store + the isolation policies + general hardening --
  - name: cluster-secrets
    group: security
    namespace: external-secrets
    wave: "-1"
    needsTenant: true
    needsVaultUrl: true
  - name: kyverno-policies
    group: security
    namespace: kyverno
    wave: "-1"

  # -- wave 0: edge. Only exists in tunnel mode (edge_mode, 10-network);
  #    the tunnel itself and its token are 50-cloudflare's. --
  - name: cloudflared
    group: edge
    namespace: cloudflared
    wave: "0"
    onlyEdgeMode: tunnel
    createNamespace: true
    namespaceLabels:
      pod-security.kubernetes.io/enforce: baseline

  # -- wave 0+: observability. kube-prometheus-stack owns the monitoring
  #    namespace; node-exporter owns monitoring-system. --
  - name: kube-prometheus-stack
    group: monitoring
    namespace: monitoring
    wave: "0"
    needsDomain: true
    # coreDns stays enabled, and the chart puts its scrape-target Service in
    # kube-system alongside the CoreDNS pods it points at.
    project: homelab-kube-system
    createNamespace: true
    namespaceLabels:
      pod-security.kubernetes.io/enforce: baseline
    extraSyncOptions:
      # The kube-prometheus-stack CRDs exceed the client-side
      # last-applied-configuration annotation size limit.
      - ServerSideApply=true
  - name: loki
    group: monitoring
    namespace: monitoring
    wave: "1"
  - name: tempo
    group: monitoring
    namespace: monitoring
    wave: "1"
  - name: node-exporter
    group: monitoring
    namespace: monitoring-system
    wave: "1"
    createNamespace: true
    namespaceLabels:
      pod-security.kubernetes.io/enforce: privileged
  - name: alloy-gateway
    group: monitoring
    namespace: monitoring
    wave: "2"
  - name: alloy-logs
    group: monitoring
    namespace: monitoring-system
    wave: "2"

  # -- wave 0: autoscaling. No dependency on kube-prometheus-stack's CRDs --
  #    prometheus.metricServer.enabled stays off, so nothing here renders a
  #    monitoring.coreos.com kind.
  - name: keda
    group: autoscaling
    namespace: keda
    wave: "0"
    # The metrics apiserver's delegated auth needs a RoleBinding in kube-system
    # against extension-apiserver-authentication; the chart emits it
    # unconditionally. The project also carries the APIService kind.
    project: homelab-kube-system
    createNamespace: true
    namespaceLabels:
      pod-security.kubernetes.io/enforce: restricted
    extraSyncOptions:
      # scaledjobs.keda.sh exceeds the client-side last-applied-configuration
      # annotation limit.
      - ServerSideApply=true

  # -- wave 1-2: database. The operator (CRDs, controller, admission webhooks)
  #    must be synced and healthy before the Cluster resource that needs it.
  #    Wave 1, not 0: podMonitorEnabled renders a monitoring.coreos.com kind
  #    and ordering within a wave is not guaranteed, so at wave 0 it would race
  #    kube-prometheus-stack's CRDs on a fresh cluster.
  - name: cloudnative-pg
    group: database
    namespace: cnpg-system
    wave: "1"
    createNamespace: true
    namespaceLabels:
      pod-security.kubernetes.io/enforce: restricted
    extraSyncOptions:
      # clusters (~272 KB) and poolers (~339 KB) exceed the client-side
      # last-applied-configuration annotation limit.
      - ServerSideApply=true
  - name: postgres
    group: database
    namespace: databases
    wave: "2"
    createNamespace: true
    namespaceLabels:
      pod-security.kubernetes.io/enforce: restricted

  # Kyverno's ServiceMonitor + PrometheusRule, split out of the wave -2
  # kyverno app: they are monitoring.coreos.com kinds, whose CRDs arrive with
  # kube-prometheus-stack at wave 0. Rendered at wave -2 they fail to apply on
  # a fresh cluster and stall the root app before the CRDs ever install.
  # Namespace kyverno, but owned by the kyverno app -- no createNamespace here.
  - name: kyverno-monitoring
    group: monitoring
    namespace: kyverno
    wave: "1"

  # The same split, for every platform component installed where its own
  # chart's serviceMonitor flag cannot be used: Cilium, cert-manager, Longhorn,
  # Traefik and ArgoCD are Terraform-installed (layers 40 and 60, both before
  # the CRDs exist), and external-secrets is a GitOps app at wave -2. Namespace
  # monitoring, owned by kube-prometheus-stack -- no createNamespace here.
  - name: infra-monitoring
    group: monitoring
    namespace: monitoring
    wave: "1"

  # The identity the self-hosted Azure DevOps agents deploy as, the dev parent
  # namespace, and the Kyverno rules that make a namespace a child of it
  # (documentation/infrastructure/azdo_agents.md). Nothing in the cluster
  # depends on it -- but platform-limits at wave 3 writes a LimitRange into
  # both namespaces this app owns, and a LimitRange cannot precede its
  # namespace.
  - name: azdo-deployer
    group: platform
    namespace: azdo-system
    wave: "2"
    createNamespace: true
    namespaceLabels:
      pod-security.kubernetes.io/enforce: restricted
    ignoreDifferences:
      # The token controller populates data.token/ca.crt/namespace on a Secret
      # whose manifest declares no data at all.
      - group: ""
        kind: Secret
        name: azdo-deployer-token
        namespace: azdo-system
        jsonPointers:
          - /data

  # -- wave 3: per-namespace memory ceilings. Last, because a LimitRange
  #    cannot be created into a namespace that does not exist yet and this app
  #    owns none of the namespaces it writes into. platform-system is its own
  #    nominal home and holds nothing else. --
  - name: platform-limits
    group: platform
    namespace: platform-system
    wave: "3"
    createNamespace: true
    namespaceLabels:
      pod-security.kubernetes.io/enforce: restricted
